<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>유사도 검사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --bg:oklch(0.975 0.006 264.5);--card:#fff;--fg:oklch(0.24 0.02 265);--meta:oklch(0.5 0.025 265);
  --muted:oklch(0.955 0.01 264);--border:oklch(0.9 0.012 264);--border-strong:oklch(0.82 0.02 264);
  --t1:oklch(0.52 0.21 26);--t2:oklch(0.55 0.13 66);--t3:oklch(0.52 0.16 251);
  --hl:oklch(0.95 0.06 80);--radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}

.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.logo{font-weight:700;font-size:17px;letter-spacing:-0.02em}
.top .r{display:flex;gap:8px}

.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--muted);transition:background .12s}
.btn:hover{background:oklch(0.92 0.012 264)}
.btn.primary{background:var(--fg);color:#fff}.btn.primary:hover{background:oklch(0.34 0.02 265)}
.btn.primary:disabled{background:var(--muted);color:var(--meta);cursor:default}
.btn.lg{height:52px;padding:0 40px;font-size:16px;border-radius:14px}
.btn.text{background:none;color:var(--meta);padding:0 10px}.btn.text:hover{color:var(--fg);background:none}

/* start */
.start{max-width:1120px;margin:0 auto;padding:56px 24px}
.start h1{font-size:28px;font-weight:700;letter-spacing:-0.03em;text-align:center;margin:0 0 8px}
.start .sub{text-align:center;color:var(--meta);margin-bottom:36px}
.mode{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:22px;font-weight:600;cursor:pointer;user-select:none}
.mode .sw{width:44px;height:26px;border-radius:99px;background:var(--border-strong);position:relative;transition:background .15s}
.mode .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:left .15s;box-shadow:0 1px 2px oklch(0 0 0/.2)}
.mode.on .sw{background:var(--fg)}.mode.on .sw::after{left:21px}
.mode .off{color:var(--meta)}.mode.on .off{color:var(--fg)}
.slots{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;align-items:stretch}
.slots.one{grid-template-columns:1fr;max-width:480px;margin:0 auto}
.swap{align-self:center;width:40px;height:40px;border-radius:99px;display:grid;place-items:center;color:var(--meta);background:var(--card);border:1px solid var(--border);margin:0 auto}
.swap:hover{color:var(--fg);border-color:var(--fg)}
.swap svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.swap:disabled{opacity:.3;cursor:default;border-color:var(--border);color:var(--meta)}
.slot{background:var(--card);border:1.5px dashed var(--border-strong);border-radius:var(--radius);min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;transition:border-color .12s,background .12s}
.slot.over{border-color:var(--fg);background:var(--muted)}
.slot:hover{border-color:var(--fg)}
.slot .name{font-size:18px;font-weight:700}
.slot .fmt{color:var(--meta);font-size:13px}
.slot.filled{border:1.5px solid var(--border);cursor:default}
.slot.filled .name{outline:none;border-radius:6px;padding:0 6px}
.slot.filled .name:focus{background:var(--muted)}
.slot.filled .info{color:var(--meta)}
.slot.filled{justify-content:flex-start;padding:22px 20px 16px}
.rule{width:100%;display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--meta)}
.rule b{color:var(--fg);font-weight:600}
.rule .warn{margin-left:auto;color:var(--t2);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.rule .acts{margin-left:auto;display:flex;gap:6px}.rule .warn+.acts{margin-left:0}
.rule .acts button{height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--fg)}
.rule .acts button:hover{background:var(--muted)}
.rule .acts .fill{background:var(--fg);color:#fff;border-color:var(--fg)}.rule .acts .fill:hover{background:oklch(0.34 0.02 265)}
.files{width:100%;margin-top:8px;max-height:300px;overflow:auto;font-size:13px}
.files div{display:grid;grid-template-columns:1fr 60px 84px;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid var(--border);color:var(--meta)}
.files.dated div{grid-template-columns:1fr 96px 96px 96px}
.files div span.dt{white-space:nowrap;text-align:right}
.files.dated .fh span:nth-child(n+2),.files.dated div>span:nth-child(n+2){text-align:right}
.files .fh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border-strong);padding:6px 4px;z-index:1}
.files .fh span{color:var(--meta)!important;font-size:12px;font-weight:600;cursor:pointer;user-select:none;text-align:left}
.files .fh span:nth-child(2){text-align:right}
.files .fh span:hover{color:var(--fg)!important}
.files .fh span::after{content:" ⇅";font-size:11px;opacity:.45}
.files .fh span.asc::after{content:" ▲";font-size:9px;opacity:1}.files .fh span.desc::after{content:" ▼";font-size:9px;opacity:1}
.files div span:first-child{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files div span:last-child{text-align:right;white-space:nowrap}
.files .ch{justify-self:end;padding:1px 8px;border-radius:6px;color:var(--fg);font-weight:500;outline:none;cursor:text}
.files .ch:hover,.files .ch:focus{background:var(--muted)}
.files .ch.bad{background:color-mix(in oklab,var(--t2),white 85%);color:var(--t2);font-weight:600}
.files div.out{opacity:.3}
.range{width:100%;display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px}
.range .lbl{color:var(--meta);white-space:nowrap}
.range .lo,.range .hi{min-width:34px;text-align:center;font-weight:600;padding:2px 6px;border-radius:6px;outline:none}
.range .lo:hover,.range .hi:hover,.range .lo:focus,.range .hi:focus{background:var(--muted)}
.range .lo::after,.range .hi::after{content:"화";font-weight:500;color:var(--meta);margin-left:1px}
.range .track{position:relative;flex:1;height:22px}
.range .track::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:99px;background:var(--border-strong)}
.range .track i{position:absolute;top:9px;height:4px;border-radius:99px;background:var(--fg);left:0;right:0}
.range input{position:absolute;inset:0;width:100%;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:99px;background:#fff;border:2px solid var(--fg);pointer-events:auto;cursor:grab;box-shadow:0 1px 3px oklch(0 0 0/.2)}
.range input::-moz-range-thumb{width:14px;height:14px;border-radius:99px;background:#fff;border:2px solid var(--fg);pointer-events:auto;cursor:grab}
.range .all{color:var(--meta);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.range .all[hidden]{display:none}
.range .all:hover{color:var(--fg)}
.bar-top .title .rng{color:var(--meta);font-weight:500;font-size:13px;margin-left:12px}
.files div.hit{outline:2px solid var(--t2);outline-offset:-2px;border-radius:6px;animation:hit 1.6s ease-out forwards}
@keyframes hit{70%{outline-color:var(--t2)}100%{outline-color:transparent}}
.abort{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;border:1.5px solid var(--t1);color:var(--t1);font-weight:700;font-size:15px}
.abort:hover{background:var(--t1);color:#fff}
.cases{display:flex;flex-direction:column;gap:40px;max-width:1000px}
.case{display:grid;grid-template-columns:1fr 1.15fr;gap:32px;align-items:start}
.case .desc h3{margin:0 0 6px;font-size:17px;letter-spacing:-0.02em}
.case .desc .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:99px;background:var(--fg);color:#fff;font-size:13px;font-weight:700;margin-right:8px;vertical-align:-3px}
.case .desc p{margin:0 0 12px;color:var(--meta);line-height:1.7}
.case .desc .ex{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.8}
.case .desc .ex .t{color:var(--meta);font-size:12px;font-weight:600;margin-bottom:4px}
.case .desc .ex code{font-family:var(--font);background:var(--muted);border-radius:4px;padding:1px 6px}
.case .desc .ex .arrow{color:var(--meta);margin:0 6px}
.case .slot{cursor:default}
.abort svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.slot .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;color:var(--meta);font-size:18px;display:grid;place-items:center}
.slot .x:hover{background:var(--muted);color:var(--fg)}
.slot .err{color:var(--t1);font-size:13px;margin-top:4px}
.go{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:32px}
.go .note{color:var(--meta);font-size:13px}
.gh{display:inline-flex;margin-left:10px;color:var(--meta);vertical-align:middle}.gh:hover{color:var(--fg)}
.gh svg{width:20px;height:20px;fill:currentColor}
.modal{position:fixed;inset:0;background:oklch(0 0 0/.4);display:grid;place-items:center;z-index:20}
.modal .box{background:var(--card);border-radius:16px;padding:28px 28px 20px;width:360px}
.modal h3{margin:0 0 6px;font-size:18px}.modal p{margin:0 0 22px;color:var(--meta)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}

/* analyzing */
.analyzing{max-width:480px;margin:140px auto 0;text-align:center}
.analyzing h2{font-size:22px;margin:0 0 6px;letter-spacing:-0.02em}
.analyzing p{color:var(--meta);margin:0 0 28px}
.bar{height:8px;border-radius:99px;background:var(--muted);overflow:hidden}.bar i{display:block;height:100%;width:63%;background:var(--fg);border-radius:99px}
.analyzing .pct{font-size:32px;font-weight:700;margin:14px 0 24px;letter-spacing:-0.02em}

/* results */
.results{height:calc(100vh - 56px);display:grid;grid-template-rows:auto 1fr}
.bar-top{display:flex;align-items:center;gap:20px;padding:0 28px;height:56px;background:var(--card);border-bottom:1px solid var(--border)}
.bar-top .title{font-weight:700;font-size:16px}
.bar-top .title span{color:var(--meta);font-weight:400;margin:0 8px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{height:36px;padding:0 14px;border-radius:99px;display:flex;align-items:center;gap:8px;color:var(--meta);font-weight:500}
.tab:hover{background:var(--muted)}.tab.on{background:var(--fg);color:#fff}
.tab b{font-weight:700}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block}.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}
.split{display:grid;grid-template-columns:400px 1fr;min-height:0}
.list{background:var(--card);border-right:1px solid var(--border);overflow:auto}
.item{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer}
.item:hover{background:var(--bg)}.item.on{background:var(--muted)}
.item .dot{margin-top:7px;flex:none}
.item .b{flex:1;min-width:0}
.item .pos{font-weight:600;display:flex;justify-content:space-between}
.item .pos span{color:var(--meta);font-weight:500}
.item .ex{color:var(--meta);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{overflow:auto;padding:28px 40px}
.detail .head{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.detail .head .pct{font-size:26px;font-weight:700;letter-spacing:-0.02em}
.detail .head .tier{font-weight:600}
.detail .head .where{color:var(--meta);margin-left:auto}
.tag{font-size:12px;font-weight:600;color:var(--meta);background:var(--muted);border-radius:6px;padding:2px 7px;white-space:nowrap}
.item .pos .tag{margin-left:8px}.detail .head .tag{align-self:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pane{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;font-size:15px;line-height:1.9}
.pane .k{font-size:13px;color:var(--meta);font-weight:600;margin-bottom:10px}
.pane .k b{color:var(--fg)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.occ{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;margin-bottom:8px;display:flex;gap:20px;font-size:15px;line-height:1.8}
.occ .ch{flex:none;width:56px;font-weight:600}

/* export overlay */
.ov{position:fixed;inset:0;background:oklch(0 0 0/.45);z-index:20;display:grid;place-items:center;padding:32px}
.ov .panel{background:var(--card);border-radius:18px;width:min(1200px,100%);height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.ov .ph{display:flex;align-items:center;gap:8px;padding:16px 24px;border-bottom:1px solid var(--border)}
.ov .ph h2{margin:0;font-size:18px;margin-right:auto}
.ov .ph .x{width:36px;height:36px;border-radius:10px;font-size:22px;color:var(--meta);display:grid;place-items:center}.ov .ph .x:hover{background:var(--muted);color:var(--fg)}
.ov .body{overflow:auto;padding:32px 40px}
.rp h1{font-size:22px;margin:0 0 14px;letter-spacing:-0.02em}
.rp .meta{display:grid;grid-template-columns:80px 1fr;gap:4px 8px;font-size:14px;margin-bottom:24px}
.rp .meta span:nth-child(odd){color:var(--meta)}.rp .meta span:nth-child(even){font-weight:600}
.rp .nums{display:flex;gap:32px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border-strong)}
.rp .nums div{font-size:13px;color:var(--meta)}.rp .nums b{display:block;font-size:24px;color:var(--fg);letter-spacing:-0.02em}
.rp .row{border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:12px;font-size:14px;line-height:1.8}
.rp .row .h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:10px}.rp .row .h span{color:var(--meta);font-weight:500;margin-left:auto}
.rp .row .ab{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.rp .row .ab>div:first-child{border-right:1px solid var(--border);padding-right:24px}
.rp .row .ab i{display:block;font-style:normal;color:var(--meta);font-weight:600;font-size:13px;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--border)}
.rp .foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--meta)}
.dd{position:relative}
.dd .menu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px oklch(0 0 0/.12);padding:6px;min-width:160px;z-index:2}
.dd .menu button{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:8px;font-weight:500}.dd .menu button:hover{background:var(--muted)}

.rv{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:oklch(0.2 0.02 265);color:#fff;border-radius:99px;padding:6px 8px;display:flex;gap:2px;font-size:12px;z-index:50}
.rv button{color:#fff;padding:6px 12px;border-radius:99px;opacity:.7}.rv button.on{opacity:1;background:#fff;color:var(--fg);font-weight:600}
@media print{.rv,.top{display:none}.report{background:#fff;padding:0}.a4{box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="logo">문장 · 문단 유사도 검사<a class="gh" href="#" title="GitHub"><svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg></a></div><div class="r" id="topR"></div></header>
<main id="app"></main>
<nav class="rv"><button data-s="start">시작</button><button data-s="loaded">파일 선택됨</button><button data-s="cases">회차 4종</button><button data-s="reject">hwp</button><button data-s="analyzing">비교 중</button><button data-s="results">결과</button><button data-s="self">내부 반복</button><button data-s="report">내보내기</button></nav>

<script>
const TIER={t1:'거의 동일',t2:'일부 수정',t3:'부분 유사'};
let SEL=0;
const P=[
 {t:'t1',pct:97,a:127,b:83,A:'그는 천천히 검을 뽑아 들었다. 칼날 위로 달빛이 <mark>미끄러졌다</mark>. "물러서라." 낮게 깔린 목소리였지만, 그 안에 담긴 무게는 누구도 가볍게 넘길 수 없었다.',B:'그는 천천히 검을 뽑아 들었다. 칼날 위로 달빛이 <mark>흘러내렸다</mark>. "물러서라." 낮게 깔린 목소리였지만, 그 안에 담긴 무게는 누구도 가볍게 넘길 수 없었다.'},
 {t:'t1',pct:94,a:33,b:19,A:'"네가 왜 여기 있어?" 유진은 대답 대신 창밖으로 시선을 돌렸다. 빗줄기가 <mark>굵어지고</mark> 있었다.',B:'"네가 왜 여기 있어?" 유진은 대답 대신 창밖으로 시선을 돌렸다. 빗줄기가 <mark>거세지고</mark> 있었다.'},
 {t:'t2',pct:83,a:388,b:402,A:'장로들은 서로 눈짓을 주고받았다. 누구도 먼저 입을 열지 <mark>않았다</mark>. 침묵이 <mark>길어질수록</mark> 등불의 그림자만 <mark>더욱</mark> 짙어졌다.',B:'장로들은 서로 눈짓을 주고받았다. 누구도 먼저 입을 열지 <mark>못했다</mark>. 침묵이 <mark>이어질수록</mark> 등불의 그림자만 <mark>한층</mark> 짙어졌다.'},
 {t:'t2',pct:81,a:212,b:140,A:'아무도 없었다. 그가 문을 열었<mark>다. 안에는 아무도 없었다</mark>. 탁자 위에는 식은 찻잔 <mark>하나</mark>만 놓여 있었다.',B:'아무도 없었다. 그가 문을 열었<mark>지만 안은 텅 비어 있었다</mark>. 탁자 위에는 식은 찻잔 <mark>두 개</mark>만 놓여 있었다.'},
 {t:'t3',pct:64,a:301,b:288,A:'그날 이후로 <mark>그녀는 다시는</mark> 그 골목을 지나지 않았다<mark>, 아니 지나지 못했다</mark>.',B:'그날 이후로 <mark>나는 두 번 다시</mark> 그 골목을 지나지 않았다.'},

    const dim=()=>{if(!rg)return;const x=+rg.querySelector('.a').value,y=+rg.querySelector('.b').value;sl.querySelectorAll('.files div:not(.fh)').forEach(r=>{const d=r.querySelector('.ch').textContent.replace(/\D/g,''),n=d?+d:null;r.classList.toggle('out',n!=null&&(n<x||n>y))})};
    if(rg){
      const a=rg.querySelector('.a'),b=rg.querySelector('.b'),lo=rg.querySelector('.lo'),hi=rg.querySelector('.hi'),fill=rg.querySelector('.track i'),all=rg.querySelector('.all'),max=+rg.dataset.max;
      const draw=()=>{let x=+a.value,y=+b.value;if(x>y){[x,y]=[y,x];a.value=x;b.value=y}lo.textContent=x;hi.textContent=y;fill.style.left=((x-1)/(max-1)*100)+'%';fill.style.right=(100-(y-1)/(max-1)*100)+'%';all.hidden=x===1&&y===max;dim()};
      a.oninput=b.oninput=draw;
      const typed=(el,inp)=>{el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}else if(e.key.length===1&&!/\d/.test(e.key))e.preventDefault()};el.onblur=()=>{const v=Math.min(max,Math.max(1,+el.textContent.replace(/\D/g,'')||1));inp.value=v;draw();a.onchange()}};
      a.onchange=b.onchange=()=>{const box=sl.querySelector('.files'),first=[...box.querySelectorAll('div:not(.fh):not(.out)')].find(r=>/\d/.test(r.querySelector('.ch').textContent));if(first)box.scrollTo({top:first.getBoundingClientRect().top-box.getBoundingClientRect().top+box.scrollTop-box.querySelector('.fh').offsetHeight,behavior:'smooth'})};
      typed(lo,a);typed(hi,b);
      all.onclick=()=>{a.value=1;b.value=max;draw()};
      draw();
    }
    const cells=[...sl.querySelectorAll('.files .ch[contenteditable]')];if(!cells.length)return;
    cells.forEach(c=>{if(!c.dataset.o)c.dataset.o=c.textContent});
    const num=c=>{const d=c.textContent.replace(/\D/g,'');return d?+d:null};
    const set=(c,v)=>{c.textContent=v==null?'?':v+'화';c.classList.toggle('bad',v==null)};
    const warn=sl.querySelector('.warn'),fill=sl.querySelector('.fill'),reset=sl.querySelector('.reset');
    const refresh=(i)=>{
      const n=sl.querySelectorAll('.ch.bad').length;if(warn)warn.textContent=n?`회차 못 읽음 ${n}개`:'';dim();
      reset.hidden=!cells.some(c=>c.textContent!==c.dataset.o);
      let run=0;if(i!=null){for(let j=i;j>0&&num(cells[j])!=null&&num(cells[j-1])===num(cells[j])-1;j--)run++;}
      const rest=cells.length-1-(i??0);
      fill.hidden=!(run>=3&&rest>0);if(!fill.hidden){fill.textContent=`아래 ${rest}개 이어서 채우기`;fill.onclick=()=>{const b=num(cells[i]);cells.forEach((c,j)=>{if(j>i)set(c,b+(j-i))});fill.hidden=true;refresh()}}
    };
    reset.onclick=()=>{cells.forEach(c=>{c.textContent=c.dataset.o;c.classList.toggle('bad',c.dataset.o==='?')});fill.hidden=true;refresh()};
    cells.forEach((c,i)=>{
      c.onfocus=()=>{c.textContent=c.textContent.replace(/\D/g,'');document.getSelection().selectAllChildren(c)};
      c.onblur=()=>{set(c,num(c));refresh(i)};
      c.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const nx=cells[i+1];nx?nx.focus():c.blur()}else if(e.key.length===1&&!/\d/.test(e.key))e.preventDefault()};
    });
  const box=sl.querySelector('.files');
  sl.querySelectorAll('.fh span').forEach(h=>h.onclick=()=>{
    const dir=h.classList.contains('asc')?'desc':'asc';sl.querySelectorAll('.fh span').forEach(x=>x.classList.remove('asc','desc'));h.classList.add(dir);
    const k=+h.dataset.k,rows=[...box.querySelectorAll('div:not(.fh)')];
    const val=r=>{const t=r.children[k].textContent;return k===0?t:(t.replace(/\D/g,'')===''?Infinity:+t.replace(/\D/g,''))};
    rows.sort((a,b)=>{const x=val(a),y=val(b);const c=k===0?String(x).localeCompare(String(y),'ko',{numeric:true}):x-y;return dir==='asc'?c:-c});
    rows.forEach(r=>box.appendChild(r));bindSlot(sl);
  });
}
document.querySelectorAll('.rv button').forEach(b=>b.onclick=()=>{SEL=0;render(b.dataset.s)});
render((location.hash||'#start').slice(1));
</script>
